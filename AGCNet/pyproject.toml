[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agcnet-reproduction"
version = "0.1.0"
description = "Paper-driven reproduction of AGCNet for online IMU compensation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "torch>=2.1"
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
agcnet-prepare-euroc = "agcnet.prepare_euroc:main"
agcnet-train = "agcnet.train:main"
agcnet-infer = "agcnet.infer:main"
agcnet-smoke = "agcnet.smoke:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learned-imu-bias-reproduction"
version = "0.1.0"
description = "Paper-driven reproduction of Learned IMU Bias Prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "torch>=2.1"
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
learned-bias-prepare-euroc = "learned_bias.prepare_euroc:main"
learned-bias-train = "learned_bias.train:main"
learned-bias-infer = "learned_bias.infer:main"
learned-bias-smoke = "learned_bias.smoke:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
